name: Import verified ASR overnight history
on:
  push:
    branches: [codex/api-snapshots]
    paths: [.github/workflows/restore-history.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download and verify the preserved original Git bundle
        run: |
          python -m pip install gdown==5.2.0
          gdown --fuzzy 'https://drive.google.com/file/d/1vYWH_4Bmvy0NM5glQCFjmIrSx6NsKpCj/view' -O history/complete-f152a54.bundle
          echo 'cc80a76d636b7f5292d7d148e7f14cf03e70364122943318ba70aa545c6fffe2  history/complete-f152a54.bundle' | sha256sum --check --strict
          git bundle verify history/complete-f152a54.bundle
          git fetch history/complete-f152a54.bundle refs/heads/codex/hw1-asr-overnight-20261014:refs/remotes/bundle/overnight
          test "$(git rev-parse refs/remotes/bundle/overnight)" = 'f152a543fc5f2a47f85e03423645597d20b7c261'
          git merge-base --is-ancestor e9ca57ddb6207d885be74c9a791ec59c3bee6b12 refs/remotes/bundle/overnight
          git push origin refs/remotes/bundle/overnight:refs/heads/codex/hw1-asr-overnight-20261014

