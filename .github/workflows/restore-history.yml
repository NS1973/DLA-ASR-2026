name: Import verified ASR overnight history
on:
  push:
    branches: [codex/api-snapshots]
    paths: [.github/workflows/restore-history.yml]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download and verify the preserved original Git bundle
        run: |
          python -m pip install gdown==5.2.0
          gdown --fuzzy 'https://drive.google.com/file/d/1qjtFx8ee_5jwJMI84ke9Uf9hNnq6TjnX/view' -O history/complete-1157d26.bundle
          echo '8b1042a36a1bbd4df9c95d64a1595efca4b252de4a8e924f990de09ce159f896  history/complete-1157d26.bundle' | sha256sum --check --strict
          git bundle verify history/complete-1157d26.bundle
          git fetch history/complete-1157d26.bundle refs/heads/codex/hw1-asr-overnight-20261014:refs/remotes/bundle/overnight
          test "$(git rev-parse refs/remotes/bundle/overnight)" = '1157d2645ea82828380dd5bbe711216fd488f38a'
          git merge-base --is-ancestor e9ca57ddb6207d885be74c9a791ec59c3bee6b12 refs/remotes/bundle/overnight
          git push origin refs/remotes/bundle/overnight:refs/heads/codex/hw1-asr-overnight-20261014

